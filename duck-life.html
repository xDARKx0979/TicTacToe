<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duck Life</title>
    <link rel="stylesheet" href="styles.css">
    <script src="theme.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: #111;
            display: flex;
            flex-direction: column;
        }
        
        .game-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        
        .game-frame {
            width: 100%;
            max-width: 800px;
            height: 600px;
            border: none;
            background-color: #000;
        }
        
        .back-link {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 999;
        }
        
        .back-button {
            padding: 10px 20px;
            background-color: #f44336;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            text-decoration: none;
            display: inline-block;
        }
        
        .back-button:hover {
            background-color: #d32f2f;
        }
        
        .game-info {
            color: white;
            text-align: center;
            margin-bottom: 20px;
            max-width: 800px;
        }

        .fullscreen-button {
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px 20px;
            margin-top: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        .fullscreen-button:hover {
            background-color: #45a049;
        }
    </style>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
    <div class="back-link">
        <a href="index.html" class="back-button">Back to Menu</a>
    </div>
    
    <div class="game-container">
        <div class="game-info">
            <h1>Duck Life</h1>
            <p>Train your duck to become a racing champion! Improve your duck's running, swimming, flying, and climbing abilities to compete in various races.</p>
        </div>
        
        <div id="ruffle-container" class="game-frame"></div>
        
        <button class="fullscreen-button" onclick="toggleFullscreen()">Fullscreen</button>
    </div>

    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        window.addEventListener("load", (event) => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("ruffle-container");
            container.appendChild(player);
            player.load("duck-life-main/ducklife.swf");
            
            // Configure player
            player.config = {
                letterbox: "on",
                quality: "high",
                wmode: "direct"
            };
            
            window.rufflePlayer = player;
        });
        
        function toggleFullscreen() {
            const container = document.getElementById("ruffle-container");
            
            if (!document.fullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                } else if (container.msRequestFullscreen) {
                    container.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }
    </script>
</body>
</html>
