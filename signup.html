<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="styles.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="auth-container">
        <h1>Sign Up</h1>
        
        <!-- Signup System Update Notice -->
        <div class="warning-box">
            <strong>Notice:</strong> We have updated our sign-in system for enhanced security. If you created an account before April 19th, you will need to sign up again. We apologize for any inconvenience this may cause.
        </div>

        <form id="signup-form" class="auth-form">
            <div id="signup-error" class="error-message"></div>
            <!-- Message for email verification status (optional, but good practice) -->
            <div id="auth-message" class="error-message"></div>
            <input type="email" id="signup-email" placeholder="Email" required>
            <input type="password" id="signup-password" placeholder="Password (min. 6 characters)" required>
            <input type="password" id="signup-confirm-password" placeholder="Confirm Password" required>
            <button type="submit" class="primary-action">Sign Up</button>
        </form>
        <p>Already have an account? <a href="login.html">Log In</a></p>
    </div>
    
    <!-- Firebase Init and Auth Logic -->
    <script src="firebase-init.js"></script> 
    <script src="auth.js"></script>
</body>
</html>
