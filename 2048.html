<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="2048-master/style/main.css">
    <style>
        .game-container {
            width: 460px;
            height: 460px;
            margin: 0 auto;
            position: relative;
            background: transparent !important;
            padding: 15px;
        }
        
        .back-button {
            display: inline-block;
            margin-bottom: 20px;
        }
        
        .container {
            width: 600px;
            padding: 20px;
            margin: 0 auto;
            border-radius: 6px;
        }
        
        .grid-container {
            width: 450px;
            height: 450px;
            padding: 0;
            position: absolute;
            z-index: 1;
        }
        
        .grid-row {
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            height: 100px;
        }
        
        .grid-row:last-child {
            margin-bottom: 0;
        }
        
        .grid-cell {
            width: 100px;
            height: 100px;
            margin-right: 15px;
            float: left;
            border-radius: 3px;
        }
        
        .grid-cell:last-child {
            margin-right: 0;
        }
        
        .tile-container {
            position: absolute;
            z-index: 2;
            top: 15px;
            left: 15px;
        }
        
        .tile {
            width: 100px;
            height: 100px;
            position: absolute;
        }
        
        .tile .tile-inner {
            width: 100px;
            height: 100px;
            line-height: 100px;
            border-radius: 3px;
            font-size: 55px;
        }
        
        /* Position adjustments for tiles */
        .tile.tile-position-1-1 { transform: translate(0px, 0px) !important; }
        .tile.tile-position-1-2 { transform: translate(0px, 115px) !important; }
        .tile.tile-position-1-3 { transform: translate(0px, 230px) !important; }
        .tile.tile-position-1-4 { transform: translate(0px, 345px) !important; }
        
        .tile.tile-position-2-1 { transform: translate(115px, 0px) !important; }
        .tile.tile-position-2-2 { transform: translate(115px, 115px) !important; }
        .tile.tile-position-2-3 { transform: translate(115px, 230px) !important; }
        .tile.tile-position-2-4 { transform: translate(115px, 345px) !important; }
        
        .tile.tile-position-3-1 { transform: translate(230px, 0px) !important; }
        .tile.tile-position-3-2 { transform: translate(230px, 115px) !important; }
        .tile.tile-position-3-3 { transform: translate(230px, 230px) !important; }
        .tile.tile-position-3-4 { transform: translate(230px, 345px) !important; }
        
        .tile.tile-position-4-1 { transform: translate(345px, 0px) !important; }
        .tile.tile-position-4-2 { transform: translate(345px, 115px) !important; }
        .tile.tile-position-4-3 { transform: translate(345px, 230px) !important; }
        .tile.tile-position-4-4 { transform: translate(345px, 345px) !important; }
        
        /* Mobile adjustments */
        @media (max-width: 650px) {
            .tile.tile-position-1-1 { transform: translate(0px, 0px) !important; }
            .tile.tile-position-1-2 { transform: translate(0px, 70px) !important; }
            .tile.tile-position-1-3 { transform: translate(0px, 140px) !important; }
            .tile.tile-position-1-4 { transform: translate(0px, 210px) !important; }
            
            .tile.tile-position-2-1 { transform: translate(70px, 0px) !important; }
            .tile.tile-position-2-2 { transform: translate(70px, 70px) !important; }
            .tile.tile-position-2-3 { transform: translate(70px, 140px) !important; }
            .tile.tile-position-2-4 { transform: translate(70px, 210px) !important; }
            
            .tile.tile-position-3-1 { transform: translate(140px, 0px) !important; }
            .tile.tile-position-3-2 { transform: translate(140px, 70px) !important; }
            .tile.tile-position-3-3 { transform: translate(140px, 140px) !important; }
            .tile.tile-position-3-4 { transform: translate(140px, 210px) !important; }
            
            .tile.tile-position-4-1 { transform: translate(210px, 0px) !important; }
            .tile.tile-position-4-2 { transform: translate(210px, 70px) !important; }
            .tile.tile-position-4-3 { transform: translate(210px, 140px) !important; }
            .tile.tile-position-4-4 { transform: translate(210px, 210px) !important; }
        }
        
        .game-explanation {
            margin-top: 480px;
        }
        
        /* Dark mode overrides */
        body.dark-mode {
            background-color: var(--bg-color);
        }
        
        body.dark-mode .container {
            background: var(--bg-color);
            color: var(--text-color);
        }
        
        body.dark-mode .grid-container {
            background: #1e1e1e;
            border-radius: 6px;
        }
        
        body.dark-mode .grid-cell {
            background: rgba(70, 70, 70, 0.35);
        }
        
        body.dark-mode .tile .tile-inner {
            box-shadow: none;
        }
        
        body.dark-mode .game-message {
            background: rgba(20, 20, 20, 0.9);
            color: white;
        }
        
        body.dark-mode .score-container, 
        body.dark-mode .best-container {
            background: #444;
        }
        
        body.dark-mode .title {
            color: var(--text-color);
        }
        
        body.dark-mode .game-intro {
            color: var(--text-color);
        }
        
        body.dark-mode .game-explanation {
            color: var(--text-color);
        }
        
        body.dark-mode .restart-button {
            background: #565656;
            color: white;
        }
        
        body.dark-mode .restart-button:hover {
            background: #676767;
        }
        
        body.dark-mode .keep-playing-button {
            background: #565656;
            color: white;
        }
        
        body.dark-mode .retry-button {
            background: #8f7a66;
            color: white;
        }
        
        /* Tile colors in dark mode */
        body.dark-mode .tile.tile-2 .tile-inner {
            background: #554f47;
            color: #f9f6f2;
        }
        
        body.dark-mode .tile.tile-4 .tile-inner {
            background: #5f5b52;
            color: #f9f6f2;
        }
        
        body.dark-mode .tile.tile-8 .tile-inner {
            background: #955422;
        }
        
        body.dark-mode .tile.tile-16 .tile-inner {
            background: #a54c17;
        }
        
        body.dark-mode .tile.tile-32 .tile-inner {
            background: #b54010;
        }
        
        body.dark-mode .tile.tile-64 .tile-inner {
            background: #c03a0a;
        }
        
        body.dark-mode .tile.tile-128 .tile-inner {
            background: #7a685c;
        }
        
        body.dark-mode .tile.tile-256 .tile-inner {
            background: #6a584c;
        }
        
        body.dark-mode .tile.tile-512 .tile-inner {
            background: #5a483c;
        }
        
        body.dark-mode .tile.tile-1024 .tile-inner {
            background: #4a382c;
        }
        
        body.dark-mode .tile.tile-2048 .tile-inner {
            background: #3a281c;
        }
        
        @media (max-width: 650px) {
            .container {
                width: 320px;
                padding: 15px;
                margin: 0 auto;
            }
            
            .game-container {
                width: 300px;
                height: 300px;
                margin: 0 auto;
                padding: 10px;
            }
            
            .grid-container {
                width: 280px;
                height: 280px;
                padding: 0;
            }
            
            .grid-row {
                height: 60px;
                margin-bottom: 10px;
            }
            
            .grid-cell {
                width: 60px;
                height: 60px;
                margin-right: 10px;
                border-radius: 3px;
            }
            
            .tile {
                width: 60px;
                height: 60px;
            }
            
            .tile .tile-inner {
                width: 60px;
                height: 60px;
                line-height: 60px;
                font-size: 30px;
            }
            
            .tile-container {
                top: 10px;
                left: 10px;
            }
            
            .game-explanation {
                margin-top: 320px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-button">← Back to Games</a>
        
        <div class="heading">
            <h1 class="title">2048</h1>
            <div class="scores-container">
                <div class="score-container">0</div>
                <div class="best-container">0</div>
            </div>
        </div>

        <div class="above-game">
            <p class="game-intro">Join the numbers and get to the <strong>2048 tile!</strong></p>
            <a class="restart-button">New Game</a>
        </div>

        <div class="game-container">
            <div class="game-message">
                <p></p>
                <div class="lower">
                    <a class="keep-playing-button">Keep going</a>
                    <a class="retry-button">Try again</a>
                </div>
            </div>

            <div class="grid-container">
                <div class="grid-row">
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                </div>
                <div class="grid-row">
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                </div>
                <div class="grid-row">
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                </div>
                <div class="grid-row">
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                </div>
            </div>

            <div class="tile-container"></div>
        </div>

        <p class="game-explanation">
            <strong class="important">How to play:</strong> Use your <strong>arrow keys</strong> to move the tiles. When two tiles with the same number touch, they <strong>merge into one!</strong>
        </p>
    </div>

    <!-- Scripts -->
    <script src="2048-master/js/bind_polyfill.js"></script>
    <script src="2048-master/js/classlist_polyfill.js"></script>
    <script src="2048-master/js/animframe_polyfill.js"></script>
    <script src="2048-master/js/keyboard_input_manager.js"></script>
    <script src="2048-master/js/html_actuator.js"></script>
    <script src="2048-master/js/grid.js"></script>
    <script src="2048-master/js/tile.js"></script>
    <script src="2048-master/js/local_storage_manager.js"></script>
    <script src="2048-master/js/game_manager.js"></script>
    <script src="2048-master/js/application.js"></script>
    <script src="theme.js"></script>
</body>
</html>
