<!DOCTYPE html>
<html lang="en" class="dark-mode">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048</title>
    <link rel="stylesheet" href="styles.css?v=20240617">
    <link rel="stylesheet" href="2048-master/style/main.css">
    <style>
        /* Support button styles */
        .support-button {
            position: fixed;
            top: 10px;
            right: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f96854;
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            z-index: 1000;
            transition: transform 0.2s;
        }
        
        .support-button:hover {
            transform: translateY(-2px);
        }
        
        .support-button svg {
            width: 20px;
            height: 20px;
        }
        
        /* Make the frame bigger for desktop */
        .container {
            width: 800px !important;
            max-width: 800px !important;
            margin: 0 auto !important;
            padding: 30px !important;
        }
        
        /* Fix score numbers */
        .score-container, .best-container {
            color: #776e65 !important;
        }
        
        /* Comprehensive dark mode overrides */
        html.dark-mode, 
        body.dark-mode {
            background-color: #121212 !important;
            color: #f9f6f2 !important;
        }
        
        /* Override the body color directly for dark mode */
        body {
            background-color: #121212 !important;
        }
        
        .dark-mode .container {
            background: #1e1e1e !important;
            color: var(--text-color) !important;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.5) !important;
        }
        
        .dark-mode .heading {
            background: #1e1e1e !important;
        }
        
        .dark-mode .title, 
        .dark-mode .game-intro, 
        .dark-mode .game-explanation {
            color: var(--text-color) !important;
        }
        
        .dark-mode .grid-container {
            background: #333 !important;
        }
        
        .dark-mode .grid-cell {
            background: rgba(70, 70, 70, 0.35) !important;
        }
        
        /* Fix score numbers in dark mode */
        .dark-mode .score-container, 
        .dark-mode .best-container {
            color: #f9f6f2 !important;
            background: #444 !important;
        }
        
        /* Force override to bypass the original CSS */
        #container.container {
            background: #1e1e1e !important;
        }
    </style>
    <script>
        // Force dark mode on page load
        document.addEventListener('DOMContentLoaded', function() {
            document.documentElement.classList.add('dark-mode');
            document.body.classList.add('dark-mode');
            
            // Apply dark mode to the container
            const container = document.querySelector('.container');
            if (container) {
                container.id = 'container'; // Add ID for easier targeting
                container.style.backgroundColor = '#1e1e1e';
            }
        });
    </script>
</head>
<body>
    <a href="https://patreon.com/Dark0979?utm_medium=unknown&utm_source=join_link&utm_campaign=creatorshare_creator&utm_content=copyLink" target="_blank" class="support-button">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M14.82 2.41c3.96 0 7.18 3.22 7.18 7.18 0 3.96-3.22 7.18-7.18 7.18-3.96 0-7.18-3.22-7.18-7.18 0-3.96 3.22-7.18 7.18-7.18zM2 21.6h5.5V2.41H2V21.6z"/>
        </svg>
        Support Creator
    </a>

    <div class="container">
        <a href="index.html" class="back-button">← Back to Games</a>
        
        <div class="heading">
            <h1 class="title">2048</h1>
            <div class="scores-container">
                <div class="score-container">0</div>
                <div class="best-container">0</div>
            </div>
        </div>

        <div class="above-game">
            <p class="game-intro">Join the numbers and get to the <strong>2048 tile!</strong></p>
            <a class="restart-button">New Game</a>
        </div>

        <div class="game-container">
            <div class="game-message">
                <p></p>
                <div class="lower">
                    <a class="keep-playing-button">Keep going</a>
                    <a class="retry-button">Try again</a>
                </div>
            </div>

            <div class="grid-container">
                <div class="grid-row">
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                </div>
                <div class="grid-row">
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                </div>
                <div class="grid-row">
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                </div>
                <div class="grid-row">
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                </div>
            </div>

            <div class="tile-container"></div>
        </div>

        <p class="game-explanation">
            <strong class="important">How to play:</strong> Use your <strong>arrow keys</strong> to move the tiles. When two tiles with the same number touch, they <strong>merge into one!</strong>
        </p>
    </div>

    <!-- Scripts -->
    <script src="2048-master/js/bind_polyfill.js"></script>
    <script src="2048-master/js/classlist_polyfill.js"></script>
    <script src="2048-master/js/animframe_polyfill.js"></script>
    <script src="2048-master/js/keyboard_input_manager.js"></script>
    <script src="2048-master/js/html_actuator.js"></script>
    <script src="2048-master/js/grid.js"></script>
    <script src="2048-master/js/tile.js"></script>
    <script src="2048-master/js/local_storage_manager.js"></script>
    <script src="2048-master/js/game_manager.js"></script>
    <script src="2048-master/js/application.js"></script>
    <script src="theme.js"></script>
</body>
</html>
