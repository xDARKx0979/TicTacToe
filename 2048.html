    <style id="theme-override"></style>
    <script>
        // Immediately check if dark mode is active and apply overrides
        document.addEventListener('DOMContentLoaded', function() {
            updateThemeOverrides();
        });
        
        // Function to update theme overrides
        function updateThemeOverrides() {
            const isDarkMode = document.documentElement.classList.contains('dark-mode') || 
                              document.body.classList.contains('dark-mode') ||
                              document.documentElement.getAttribute('data-theme') === 'dark';
            
            const themeOverride = document.getElementById('theme-override');
            if (isDarkMode) {
                themeOverride.textContent = `
                    html, body, .container, .heading, .above-game, .game-container, .game-explanation {
                        background-color: var(--bg-color) !important;
                        color: var(--text-color) !important;
                    }
                    .container {
                        box-shadow: none !important;
                    }
                `;
            } else {
                themeOverride.textContent = '';
            }
        }
        
        // Override the theme toggle function to update overrides
        const originalToggleTheme = window.toggleTheme;
        window.toggleTheme = function() {
            if (originalToggleTheme) {
                originalToggleTheme.apply(this, arguments);
            }
            updateThemeOverrides();
        };
    </script>
