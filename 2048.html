    <script>
        // Check theme on page load
        document.addEventListener('DOMContentLoaded', function() {
            // Set container ID for easier targeting
            const container = document.querySelector('.container');
            if (container) {
                container.id = 'container';
            }
            
            // Check for saved theme preference
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark-mode');
                document.body.classList.add('dark-mode');
                
                // Apply dark mode to the container
                if (container) {
                    container.style.backgroundColor = '#1e1e1e';
                }
            } else {
                // Ensure light mode is applied
                document.documentElement.classList.remove('dark-mode');
                document.body.classList.remove('dark-mode');
                
                // Apply light mode to the container
                if (container) {
                    container.style.backgroundColor = '#faf8ef';
                }
            }
            
            // Add bot button functionality
            let botActive = false;
            const botButton = document.createElement('button');
            botButton.className = 'bot-button';
            botButton.textContent = 'Assistant';
            document.body.appendChild(botButton);
            
            // Create recommendation display
            const recommendation = document.createElement('div');
            recommendation.className = 'recommendation';
            document.body.appendChild(recommendation);
            
            botButton.addEventListener('click', function() {
                if (!botActive) {
                    const code = prompt('Enter 4-digit code:');
                    if (code === '7362') {
                        botActive = true;
                        window.botActive = true; // Make globally available
                        botButton.textContent = 'Assistant (Active)';
                        botButton.style.background = '#2ecc71';
                        
                        // Start providing recommendations
                        showRecommendation();
                        
                        // Setup observer to update recommendation when game state changes
                        setupGameObserver();
                        
                        alert('Move assistant activated! Win mode enabled!');
                    } else if (code !== null) {
                        alert('Incorrect code');
                    }
                } else {
                    botActive = false;
                    window.botActive = false;
                    botButton.textContent = 'Assistant';
                    botButton.style.background = '';
                    recommendation.style.display = 'none';
                }
            });
            
            function showRecommendation() {
                if (!botActive) return;
                
                try {
                    // Get the game manager instance
                    const gameManager = window.gameManager;
                    if (!gameManager) {
                        console.error('Could not access game manager');
                        return;
                    }
                    
                    const bestMove = findBestMove(gameManager.grid);
                    
                    // Display recommendation
                    recommendation.style.display = 'block';
                    recommendation.textContent = 'Recommended move: ' + bestMove;
                } catch (e) {
                    console.error('Error calculating recommendation', e);
                    recommendation.textContent = 'Error calculating move';
                }
            }
            
            function setupGameObserver() {
                // Set up a MutationObserver to detect game state changes
                const observer = new MutationObserver(function(mutations) {
                    showRecommendation();
                });
                
                // Observe the tile container for changes
                const tileContainer = document.querySelector('.tile-container');
                if (tileContainer) {
                    observer.observe(tileContainer, { childList: true, subtree: true });
                }
            }
            
            function calculateBestMove(grid) {
                // This is the old function - we'll use findBestMove instead
                return "Unknown";
            }
            
            function findBestMove(grid) {
                const directions = {
                    0: '↑ Up',
                    1: '→ Right',
                    2: '↓ Down',
                    3: '← Left'
                };
                
                let bestScore = -1;
                let bestDirection = -1;
                
                // Try each direction
                for (let direction = 0; direction < 4; direction++) {
                    // Clone the grid to simulate the move
                    const gridCopy = cloneGridForSimulation(grid);
                    
                    // Simulate the move in this direction
                    const moveResult = simulateMove(gridCopy, direction);
                    
                    // If this move is valid (changes the grid)
                    if (moveResult.moved) {
                        // Evaluate the position after the move
                        const score = evaluateGridPosition(gridCopy);
                        
                        // If this is the best score so far, update best move
                        if (score > bestScore) {
                            bestScore = score;
                            bestDirection = direction;
                        }
                    }
                }
                
                return bestDirection >= 0 ? directions[bestDirection] : "No valid move";
            }
            
            function cloneGridForSimulation(grid) {
                // Create a deep copy of the grid
                const clone = {
                    cells: [],
                    size: grid.size
                };
                
                // Clone the cells array
                for (let x = 0; x < grid.size; x++) {
                    clone.cells[x] = [];
                    for (let y = 0; y < grid.size; y++) {
                        if (grid.cells[x][y]) {
                            clone.cells[x][y] = {
                                x: grid.cells[x][y].x,
                                y: grid.cells[x][y].y,
                                value: grid.cells[x][y].value
                            };
                        } else {
                            clone.cells[x][y] = null;
                        }
                    }
                }
                
                return clone;
            }
            
            function simulateMove(grid, direction) {
                // Returns {moved: boolean, score: number}
                let moved = false;
                let score = 0;
                
                // Define vector based on direction
                // 0: up, 1: right, 2: down, 3: left
                const vector = {
                    x: [0, 1, 0, -1][direction],
                    y: [-1, 0, 1, 0][direction]
                };
                
                // Determine traversal order based on direction
                const traversals = buildTraversals(vector, grid.size);
                
                // Save current tile positions
                const savedCells = [];
                for (let x = 0; x < grid.size; x++) {
                    savedCells[x] = [];
                    for (let y = 0; y < grid.size; y++) {
                        savedCells[x][y] = grid.cells[x][y];
                    }
                }
                
                // Reset merged flags
                const mergedTiles = [];
                for (let x = 0; x < grid.size; x++) {
                    mergedTiles[x] = [];
                    for (let y = 0; y < grid.size; y++) {
                        mergedTiles[x][y] = false;
                    }
                }
                
                // Traverse the grid in proper order
                traversals.x.forEach(x => {
                    traversals.y.forEach(y => {
                        const tile = grid.cells[x][y];
                        
                        if (tile) {
                            // Find farthest position
                            const positions = findFarthestPosition(grid, {x, y}, vector);
                            const next = positions.next;
                            
                            // If there's a next cell and it can be merged with current
                            if (next && grid.cells[next.x][next.y] && 
                                grid.cells[next.x][next.y].value === tile.value && 
                                !mergedTiles[next.x][next.y]) {
                                
                                // Merge the tiles
                                const merged = {
                                    x: next.x,
                                    y: next.y,
                                    value: tile.value * 2
                                };
                                
                                // Update the grid
                                grid.cells[merged.x][merged.y] = merged;
                                grid.cells[x][y] = null;
                                
                                // Mark as merged
                                mergedTiles[merged.x][merged.y] = true;
                                
                                // Update score
                                score += merged.value;
                                
                                // The grid changed
                                moved = true;
                            } else {
                                // Move tile to the farthest position
                                const farthest = positions.farthest;
                                
                                if (farthest.x !== x || farthest.y !== y) {
                                    // Update position
                                    grid.cells[farthest.x][farthest.y] = {
                                        x: farthest.x,
                                        y: farthest.y,
                                        value: tile.value
                                    };
                                    grid.cells[x][y] = null;
                                    
                                    // The grid changed
                                    moved = true;
                                }
                            }
                        }
                    });
                });
                
                return { moved, score };
            }
            
            function buildTraversals(vector, size) {
                const traversals = { x: [], y: [] };
                
                for (let i = 0; i < size; i++) {
                    traversals.x.push(i);
                    traversals.y.push(i);
                }
                
                // Always traverse from the edge towards the vector origin
                if (vector.x === 1) traversals.x = traversals.x.reverse();
                if (vector.y === 1) traversals.y = traversals.y.reverse();
                
                return traversals;
            }
            
            function findFarthestPosition(grid, cell, vector) {
                // Progress towards the vector direction until an obstacle is found
                let previous;
                let current = { x: cell.x, y: cell.y };
                
                // Iteratively check the next position
                do {
                    previous = current;
                    current = { x: previous.x + vector.x, y: previous.y + vector.y };
                } while (isWithinBounds(current, grid.size) && !cellOccupied(grid, current));
                
                return {
                    farthest: previous,
                    next: isWithinBounds(current, grid.size) && cellOccupied(grid, current) ? current : null
                };
            }
            
            function isWithinBounds(position, size) {
                return position.x >= 0 && position.x < size && 
                       position.y >= 0 && position.y < size;
            }
            
            function cellOccupied(grid, position) {
                return !!grid.cells[position.x][position.y];
            }
            
            function evaluateGridPosition(grid) {
                let score = 0;
                
                // Weights for different heuristics
                const weights = {
                    emptyCells: 10,
                    highestValue: 1.0,
                    smoothness: 0.1,
                    monotonicity: 1.0,
                    cornerHighValue: 20
                };
                
                // 1. Count empty cells - more is better
                const emptyCellCount = countEmptyCells(grid.cells);
                score += emptyCellCount * weights.emptyCells;
                
                // 2. Higher values are better
                const highestValue = findHighestValue(grid.cells);
                score += highestValue * weights.highestValue;
                
                // 3. Monotonicity - tiles should increase in value in a direction
                const monotonicity = calculateAdvancedMonotonicity(grid.cells);
                score += monotonicity * weights.monotonicity;
                
                // 4. Smoothness - adjacent tiles should have similar values
                const smoothness = calculateAdvancedSmoothness(grid.cells);
                score += smoothness * weights.smoothness;
                
                // 5. High values in corner are good
                const cornerBonus = evaluateCornerPlacement(grid.cells);
                score += cornerBonus * weights.cornerHighValue;
                
                return score;
            }
            
            function countEmptyCells(cells) {
                let count = 0;
                for (let x = 0; x < cells.length; x++) {
                    for (let y = 0; y < cells[x].length; y++) {
                        if (!cells[x][y]) {
                            count++;
                        }
                    }
                }
                return count;
            }
            
            function findHighestValue(cells) {
                let highest = 0;
                for (let x = 0; x < cells.length; x++) {
                    for (let y = 0; y < cells[x].length; y++) {
                        if (cells[x][y] && cells[x][y].value > highest) {
                            highest = cells[x][y].value;
                        }
                    }
                }
                return highest;
            }
            
            function calculateAdvancedMonotonicity(cells) {
                // Measure how monotonic the grid is (increasing or decreasing)
                const size = cells.length;
                let totalScore = 0;
                
                // Heuristic: Check horizontal and vertical monotonicity
                
                // Check horizontal monotonicity
                for (let y = 0; y < size; y++) {
                    let currentRowIncreasing = 0;
                    let currentRowDecreasing = 0;
                    
                    for (let x = 1; x < size; x++) {
                        const current = cells[x][y] ? Math.log2(cells[x][y].value) : 0;
                        const previous = cells[x-1][y] ? Math.log2(cells[x-1][y].value) : 0;
                        
                        if (current > previous) {
                            currentRowIncreasing += (current - previous);
                        } else if (current < previous) {
                            currentRowDecreasing += (previous - current);
                        }
                    }
                    
                    // Take the best monotonicity direction (higher is better)
                    totalScore -= Math.min(currentRowIncreasing, currentRowDecreasing);
                }
                
                // Check vertical monotonicity
                for (let x = 0; x < size; x++) {
                    let currentColIncreasing = 0;
                    let currentColDecreasing = 0;
                    
                    for (let y = 1; y < size; y++) {
                        const current = cells[x][y] ? Math.log2(cells[x][y].value) : 0;
                        const previous = cells[x][y-1] ? Math.log2(cells[x][y-1].value) : 0;
                        
                        if (current > previous) {
                            currentColIncreasing += (current - previous);
                        } else if (current < previous) {
                            currentColDecreasing += (previous - current);
                        }
                    }
                    
                    // Take the best monotonicity direction (higher is better)
                    totalScore -= Math.min(currentColIncreasing, currentColDecreasing);
                }
                
                return totalScore;
            }
            
            function calculateAdvancedSmoothness(cells) {
                // Measure how smooth the grid is (difference between adjacent tiles)
                const size = cells.length;
                let smoothness = 0;
                
                for (let x = 0; x < size; x++) {
                    for (let y = 0; y < size; y++) {
                        if (cells[x][y]) {
                            const value = Math.log2(cells[x][y].value);
                            
                            // Check horizontal neighbor
                            if (x < size - 1 && cells[x+1][y]) {
                                const neighborValue = Math.log2(cells[x+1][y].value);
                                smoothness -= Math.abs(value - neighborValue);
                            }
                            
                            // Check vertical neighbor
                            if (y < size - 1 && cells[x][y+1]) {
                                const neighborValue = Math.log2(cells[x][y+1].value);
                                smoothness -= Math.abs(value - neighborValue);
                            }
                        }
                    }
                }
                
                return smoothness;
            }
            
            function evaluateCornerPlacement(cells) {
                const size = cells.length;
                let cornerScore = 0;
                
                // Define corners
                const corners = [
                    {x: 0, y: 0},
                    {x: 0, y: size-1},
                    {x: size-1, y: 0},
                    {x: size-1, y: size-1}
                ];
                
                // Find highest value
                const highest = findHighestValue(cells);
                
                // Check if highest value is in a corner
                for (const corner of corners) {
                    if (cells[corner.x][corner.y] && cells[corner.x][corner.y].value === highest) {
                        cornerScore += 1;
                        
                        // Add bonus for snake pattern starting from this corner
                        const snakeBonus = evaluateSnakePattern(cells, corner);
                        cornerScore += snakeBonus;
                    }
                }
                
                return cornerScore;
            }
            
            function evaluateSnakePattern(cells, startCorner) {
                // Check if tiles form a snake pattern from the corner
                // This is a common strategy in 2048
                
                const size = cells.length;
                let score = 0;
                
                // Define snake paths for each corner
                const snakePaths = {
                    "0,0": [  // Top left corner
                        [{x:0,y:0}, {x:0,y:1}, {x:0,y:2}, {x:0,y:3}],
                        [{x:0,y:3}, {x:1,y:3}, {x:1,y:2}, {x:1,y:1}],
                        [{x:1,y:1}, {x:1,y:0}, {x:2,y:0}, {x:2,y:1}],
                        [{x:2,y:1}, {x:2,y:2}, {x:2,y:3}, {x:3,y:3}],
                        [{x:3,y:3}, {x:3,y:2}, {x:3,y:1}, {x:3,y:0}]
                    ],
                    "0,3": [  // Bottom left corner
                        [{x:0,y:3}, {x:0,y:2}, {x:0,y:1}, {x:0,y:0}],
                        [{x:0,y:0}, {x:1,y:0}, {x:1,y:1}, {x:1,y:2}],
                        [{x:1,y:2}, {x:1,y:3}, {x:2,y:3}, {x:2,y:2}],
                        [{x:2,y:2}, {x:2,y:1}, {x:2,y:0}, {x:3,y:0}],
                        [{x:3,y:0}, {x:3,y:1}, {x:3,y:2}, {x:3,y:3}]
                    ],
                    "3,0": [  // Top right corner
                        [{x:3,y:0}, {x:3,y:1}, {x:3,y:2}, {x:3,y:3}],
                        [{x:3,y:3}, {x:2,y:3}, {x:2,y:2}, {x:2,y:1}],
                        [{x:2,y:1}, {x:2,y:0}, {x:1,y:0}, {x:1,y:1}],
                        [{x:1,y:1}, {x:1,y:2}, {x:1,y:3}, {x:0,y:3}],
                        [{x:0,y:3}, {x:0,y:2}, {x:0,y:1}, {x:0,y:0}]
                    ],
                    "3,3": [  // Bottom right corner
                        [{x:3,y:3}, {x:3,y:2}, {x:3,y:1}, {x:3,y:0}],
                        [{x:3,y:0}, {x:2,y:0}, {x:2,y:1}, {x:2,y:2}],
                        [{x:2,y:2}, {x:2,y:3}, {x:1,y:3}, {x:1,y:2}],
                        [{x:1,y:2}, {x:1,y:1}, {x:1,y:0}, {x:0,y:0}],
                        [{x:0,y:0}, {x:0,y:1}, {x:0,y:2}, {x:0,y:3}]
                    ]
                };
                
                // Get the snake path for this corner
                const cornerKey = `${startCorner.x},${startCorner.y}`;
                const path = snakePaths[cornerKey];
                
                if (path) {
                    // Check if values decrease along the path
                    let lastValue = Infinity;
                    let expectedValue = cells[startCorner.x][startCorner.y] ? cells[startCorner.x][startCorner.y].value : 0;
                    
                    for (const segment of path) {
                        for (const pos of segment) {
                            const currentCell = cells[pos.x][pos.y];
                            const currentValue = currentCell ? currentCell.value : 0;
                            
                            if (currentValue === 0) {
                                break;
                            }
                            
                            if (currentValue <= lastValue) {
                                score += 1;
                            }
                            
                            lastValue = currentValue;
                        }
                    }
                }
                
                return score;
            }
        });

    <!-- Scripts -->
    <script src="2048-master/js/bind_polyfill.js"></script>

    <script>
        // Capture the GameManager when it's created
        (function() {
            // Keep reference to the original GameManager constructor
            const originalGameManager = window.GameManager;
            
            // Replace with our wrapped version
            window.GameManager = function(size, InputManager, Actuator, StorageManager) {
                // Create game manager instance
                const instance = new originalGameManager(size, InputManager, Actuator, StorageManager);
                
                // Store reference to it globally
                window.gameManager = instance;
                
                // Save original addRandomTile method
                const originalAddRandomTile = instance.addRandomTile;
                
                // Override the addRandomTile method to prevent losing
                instance.addRandomTile = function() {
                    // Check if bot is active
                    if (window.botActive) {
                        // Get available cells
                        const availableCells = this.grid.availableCells();
                        
                        if (availableCells.length) {
                            // First, check if we're in danger of losing
                            const inDanger = this.checkIfGameCouldEnd();
                            
                            if (inDanger) {
                                // Choose a smart position for the tile
                                const bestTilePosition = this.findBestTilePosition();
                                // Always use a 2 (easier)
                                const tile = new Tile(bestTilePosition, 2);
                                this.grid.insertTile(tile);
                            } else {
                                // Not in danger, use the original method
                                originalAddRandomTile.call(this);
                            }
                        }
                    } else {
                        // Bot not active, use original method
                        originalAddRandomTile.call(this);
                    }
                };
                
                // HELPER METHODS - These don't override any existing functionality
                
                // Add method to check if game could end next move
                instance.checkIfGameCouldEnd = function() {
                    // Get all empty cells
                    const emptyCells = this.grid.availableCells();
                    
                    // If more than 3 empty cells, we're probably safe
                    if (emptyCells.length > 3) return false;
                    
                    // Try placing a 4 (worst case) in each empty cell and see if any move is possible
                    for (const cell of emptyCells) {
                        // Create a temporary grid to test
                        const gridCopy = this.grid.clone();
                        
                        // Insert a 4 at this position
                        const testTile = new Tile(cell, 4);
                        gridCopy.insertTile(testTile);
                        
                        // Use the original game's move availability check
                        if (!this.isMovesAvailable(gridCopy)) {
                            // This cell would cause a game over! We're in danger
                            return true;
                        }
                    }
                    
                    // All cells were safe
                    return false;
                };
                
                // Use a custom function instead of overriding original game methods
                instance.isMovesAvailable = function(grid) {
                    return grid.cellsAvailable() || this.isTileMatchesAvailable(grid);
                };
                
                // Custom helper that doesn't override original methods
                instance.isTileMatchesAvailable = function(grid) {
                    const size = grid.size;
                    
                    for (let x = 0; x < size; x++) {
                        for (let y = 0; y < size; y++) {
                            const tile = grid.cellContent({x: x, y: y});
                            
                            if (tile) {
                                // Check all adjacent cells
                                for (let direction = 0; direction < 4; direction++) {
                                    const vector = this.getVectorForDirection(direction);
                                    const cell = { x: x + vector.x, y: y + vector.y };
                                    
                                    const other = grid.cellContent(cell);
                                    
                                    if (other && other.value === tile.value) {
                                        return true; // These tiles can be merged
                                    }
                                }
                            }
                        }
                    }
                    
                    return false;
                };
                
                // Helper function that doesn't override original methods
                instance.getVectorForDirection = function(direction) {
                    // Vectors representing tile movement
                    return {
                        0: { x: 0,  y: -1 }, // Up
                        1: { x: 1,  y: 0 },  // Right
                        2: { x: 0,  y: 1 },  // Down
                        3: { x: -1, y: 0 }   // Left
                    }[direction];
                };
                
                // Find best position for new tile to prevent game over
                instance.findBestTilePosition = function() {
                    const emptyCells = this.grid.availableCells();
                    
                    // If no empty cells, just return the first one (shouldn't happen)
                    if (emptyCells.length === 0) return emptyCells[0];
                    
                    let bestCell = emptyCells[0];
                    let bestScore = -Infinity;
                    
                    // Try each empty cell
                    for (const cell of emptyCells) {
                        // Create a temporary grid
                        const gridCopy = this.grid.clone();
                        
                        // Test with a 2 (most common)
                        const testTile = new Tile(cell, 2);
                        gridCopy.insertTile(testTile);
                        
                        // Calculate score for this position
                        let score = 0;
                        
                        // Check if moves would still be available (most important)
                        if (this.isMovesAvailable(gridCopy)) {
                            score += 1000; // Big bonus for not ending the game
                            
                            // Add additional score for positions that are good
                            // Prefer cells that are adjacent to identical values (can be merged)
                            score += this.scoreAdjacentMerges(gridCopy, cell);
                            
                            // Prefer cells that are not in corners (unless it's a merge)
                            if (this.isCorner(cell) && this.scoreAdjacentMerges(gridCopy, cell) === 0) {
                                score -= 10;
                            }
                        }
                        
                        // Update best if this is better
                        if (score > bestScore) {
                            bestScore = score;
                            bestCell = cell;
                        }
                    }
                    
                    return bestCell;
                };
                
                // Check if a cell is in a corner
                instance.isCorner = function(cell) {
                    const size = this.grid.size;
                    return (cell.x === 0 && cell.y === 0) || 
                           (cell.x === 0 && cell.y === size-1) ||
                           (cell.x === size-1 && cell.y === 0) ||
                           (cell.x === size-1 && cell.y === size-1);
                };
                
                // Score based on adjacent tiles that could merge
                instance.scoreAdjacentMerges = function(grid, cell) {
                    const value = 2; // We're testing with a 2
                    let score = 0;
                    
                    // Check all four directions
                    const directions = [
                        {x: 0, y: -1}, // Up
                        {x: 1, y: 0},  // Right
                        {x: 0, y: 1},  // Down
                        {x: -1, y: 0}  // Left
                    ];
                    
                    for (const dir of directions) {
                        const newX = cell.x + dir.x;
                        const newY = cell.y + dir.y;
                        
                        // If within bounds
                        if (newX >= 0 && newX < grid.size && newY >= 0 && newY < grid.size) {
                            const tile = grid.cells[newX][newY];
                            
                            // If adjacent tile has the same value, it's a potential merge
                            if (tile && tile.value === value) {
                                score += 20;
                            }
                        }
                    }
                    
                    return score;
                };
                
                return instance;
            };
            
            // Copy prototype methods
            for (const prop in originalGameManager.prototype) {
                if (originalGameManager.prototype.hasOwnProperty(prop)) {
                    window.GameManager.prototype[prop] = originalGameManager.prototype[prop];
                }
            }
        })();
    </script>
