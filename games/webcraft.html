<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebCraft</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px; /* Add some space at the top */
        }
        .game-container {
            width: 90%;
            max-width: 900px; /* Adjust max-width as needed */
            margin-bottom: 20px;
        }
        iframe {
            width: 100%;
            height: 600px; /* Adjust height as needed */
            border: none;
            display: block; /* Remove potential extra space below iframe */
        }
         /* Basic styling for back button */
        .back-button { 
            display: inline-block;
            padding: 10px 20px;
            margin-top: 20px;
            background-color: var(--button-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            text-decoration: none;
            transition: background-color 0.2s;
        }
        .back-button:hover {
            background-color: var(--button-hover);
        }
    </style>
</head>
<body>
    
    <h1>WebCraft</h1> 
    <div class="game-container">
        <iframe src="../WebCraft-master/singleplayer.html" title="WebCraft Game"></iframe>
    </div>
    
    <a href="../index.html" class="back-button">Back to Games</a>

    <!-- Firebase Init and Auth Logic (Important for protecting the page) -->
    <script src="../firebase-init.js"></script> 
    <script src="../auth.js"></script>
    <!-- Theme script if needed -->
    <script src="../theme.js"></script>

</body>
</html>
