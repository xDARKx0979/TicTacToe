<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minicraft</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px; /* Add some space at the top */
            margin: 0;
            overflow: hidden; /* Prevent scrollbars from the main page */
        }
        .game-container {
            width: 100%; /* Take full width */
            height: calc(100vh - 80px); /* Adjust height to fill most of viewport, leaving space for title/button */
            margin-bottom: 10px;
            position: relative; /* Needed for potential overlays or absolute positioning inside */
        }
        iframe {
            width: 100%;
            height: 100%; /* Fill the container */
            border: none;
            display: block; 
        }
         /* Basic styling for back button */
        .back-button { 
            display: inline-block;
            padding: 8px 16px;
            margin-top: 10px;
            background-color: var(--button-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 5px;
            text-decoration: none;
            transition: background-color 0.2s;
            font-size: 0.9em;
        }
        .back-button:hover {
            background-color: var(--button-hover);
        }
         h1 {
            margin-bottom: 10px; /* Reduce margin below title */
        }
    </style>
</head>
<body>
    
    <h1>Minicraft</h1> 
    <div class="game-container">
        <iframe src="https://minecraft.kelvinzhang.ca/" 
                title="Minicraft Game" 
                allow="fullscreen; pointer-lock"> <!-- Request permissions -->
        </iframe>
    </div>
    
    <a href="../index.html" class="back-button">Back to Games</a>

    <!-- Firebase Init and Auth Logic (Important for protecting the page) -->
    <script src="../firebase-init.js"></script> 
    <script src="../auth.js"></script>
    <!-- Theme script if needed -->
    <script src="../theme.js"></script>

</body>
</html>
