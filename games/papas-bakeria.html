<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Papa's Bakeria</title>
    <link rel="stylesheet" href="../styles.css">
    <script src="../theme.js"></script>
    <!-- Google AdSense Code -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8366001403141760"
     crossorigin="anonymous"></script>
    <style>
        .game-container {
            width: 100%;
            height: calc(100vh - 60px);
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 10px;
            position: relative;
        }
        #ruffle-player {
            width: 800px;
            height: 600px;
            max-width: 95vw;
            max-height: 71.25vw; /* Maintains 4:3 aspect ratio */
        }
        @media (max-height: 700px) {
            #ruffle-player {
                height: 85vh;
                width: 113.33vh; /* Maintains 4:3 aspect ratio */
                max-width: 95vw;
            }
        }
        .fullscreen-button {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--button-bg);
            color: var(--text-color);
            border: none;
            border-radius: 5px;
            padding: 8px 15px;
            cursor: pointer;
            z-index: 1000;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .fullscreen-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        /* Fullscreen styles */
        .game-container.fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            background: var(--bg-color);
            margin: 0;
            padding: 0;
        }
        .game-container.fullscreen #ruffle-player {
            width: 100vw;
            height: 100vh;
            max-width: none;
            max-height: none;
        }
        .support-button {
            position: fixed;
            top: 10px;
            right: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f96854;
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            z-index: 1000;
            transition: transform 0.2s;
        }
        
        .support-button:hover {
            transform: translateY(-2px);
        }
        
        .support-button svg {
            width: 20px;
            height: 20px;
        }
    </style>
    <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
</head>
<body>
    <a href="../support.html" target="_blank" class="support-button">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
            <path d="M14.82 2.41c3.96 0 7.18 3.22 7.18 7.18 0 3.96-3.22 7.18-7.18 7.18-3.96 0-7.18-3.22-7.18-7.18 0-3.96 3.22-7.18 7.18-7.18zM2 21.6h5.5V2.41H2V21.6z"/>
        </svg>
        Support Creator
    </a>

    <div class="container">
        <a href="../papas-restaurant.html" class="back-button">← Back to Papa's Games</a>
        <div class="game-container" id="gameContainer">
            <button class="fullscreen-button" onclick="toggleFullscreen()">Fullscreen</button>
            <div id="ruffle-player"></div>
        </div>
    </div>
    <script>
        window.RufflePlayer = window.RufflePlayer || {};
        let rufflePlayer;

        window.addEventListener("load", (event) => {
            const ruffle = window.RufflePlayer.newest();
            const player = ruffle.createPlayer();
            const container = document.getElementById("ruffle-player");
            container.appendChild(player);
            rufflePlayer = player;
            player.load("../Papas-Restuarant-Online-main/Papa's Restaurant/Papa's Bakeria/Papa's Bakeria.swf");
            
            // Set initial size
            player.style.width = '100%';
            player.style.height = '100%';
        });

        function toggleFullscreen() {
            const gameContainer = document.getElementById('gameContainer');
            
            if (document.fullscreenElement) {
                document.exitFullscreen();
            } else {
                gameContainer.requestFullscreen().catch(err => {
                    console.error(`Error attempting to enable fullscreen: ${err.message}`);
                });
            }
        }

        // Handle ESC key to exit fullscreen
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && document.fullscreenElement) {
                document.exitFullscreen();
            }
        });

        // Handle fullscreen change events
        document.addEventListener('fullscreenchange', function() {
            const gameContainer = document.getElementById('gameContainer');
            if (document.fullscreenElement) {
                gameContainer.classList.add('fullscreen');
            } else {
                gameContainer.classList.remove('fullscreen');
            }
        });
    </script>
</body>
</html>
