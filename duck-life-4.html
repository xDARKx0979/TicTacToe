<!DOCTYPE html>
<html>
<head>
    <title>Duck Life 4</title>
    <link rel="stylesheet" href="styles.css">
    <script src="theme.js"></script>
    <!-- Google AdSense Code -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8366001403141760"
     crossorigin="anonymous"></script>
    <style>
        .game-container {
            width: 960px;
            height: 600px;
            max-width: 100%;
            margin: 0 auto;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            border-radius: 5px;
            overflow: hidden;
            position: relative;
            background-color: #121212;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .back-button {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }
        .back-button:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }
        .dark-mode .game-container {
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-button">← Back to Games</a>
        <h1>Duck Life 4</h1>
        <div class="game-container">
            <iframe src="DuckLife4-direct.html" allowfullscreen="true" scrolling="no"></iframe>
        </div>
    </div>
</body>
</html>
