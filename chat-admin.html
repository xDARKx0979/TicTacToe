<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Chat Console</title>
    <link rel="stylesheet" href="styles.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

    <!-- Add styles directly here for now, will move to styles.css later -->
    <style>
        body {
            display: flex;
            height: 100vh;
            overflow: hidden; /* Prevent body scroll */
        }
        #user-list-container {
            width: 250px;
            border-right: 1px solid var(--border-color);
            padding: 15px;
            overflow-y: auto;
            background-color: var(--container-bg);
        }
        #user-list-container h2 {
            margin-top: 0;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }
        #user-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        #user-list li {
            padding: 10px;
            cursor: pointer;
            border-radius: 4px;
            margin-bottom: 5px;
            transition: background-color 0.2s;
        }
        #user-list li:hover {
            background-color: var(--cell-hover);
        }
        #user-list li.active {
            background-color: var(--primary-color);
            color: white;
            font-weight: bold;
        }
         #user-list li .email { /* Style for email display */
             font-size: 0.9em;
             color: var(--text-light);
             display: block; /* Ensure it appears on a new line */
         }
         #user-list li.active .email {
             color: #eee;
         }
        
        #admin-chat-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            height: 100vh; /* Full height */
            background-color: var(--background-color);
        }
        #admin-chat-messages {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        #admin-chat-input-area {
            display: flex;
            padding: 15px;
            border-top: 1px solid var(--border-color);
            background-color: var(--container-bg);
        }
        #admin-chat-input {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 20px;
            margin-right: 10px;
            background-color: var(--input-bg);
            color: var(--text-color);
        }
        #admin-send-button {
            padding: 10px 20px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        /* Message styles (copied from chat-user.html for consistency) */
        .message {
            margin-bottom: 15px;
            padding: 10px 15px;
            border-radius: 18px;
            max-width: 70%;
            line-height: 1.4;
        }
        .message .sender {
            font-weight: bold;
            margin-bottom: 4px;
            font-size: 0.9em;
            color: var(--text-secondary);
        }
        .user-message {
            background-color: var(--primary-color);
            color: white;
            align-self: flex-start; /* User messages on left for admin */
            border-bottom-left-radius: 5px;
        }
        .dev-message {
            background-color: var(--button-bg);
            color: var(--text-color);
            align-self: flex-end; /* Dev messages on right for admin */
            border-bottom-right-radius: 5px;
        }
        .dev-message .sender {
             color: var(--text-light); 
         }
         .loading, .error, .no-chat-selected {
             text-align: center;
             padding: 50px 20px;
             color: var(--text-secondary);
             margin: auto;
         }
    </style>
</head>
<body>
    <div id="user-list-container">
        <h2>User Chats</h2>
        <ul id="user-list">
            <li class="loading">Loading users...</li>
            <!-- User list will be populated here -->
        </ul>
    </div>

    <div id="admin-chat-container">
        <div id="admin-chat-messages">
             <div class="no-chat-selected">Select a user to view chat.</div>
            <!-- Messages for the selected user will load here -->
        </div>
        <div id="admin-chat-input-area" style="display: none;"> <!-- Hidden initially -->
            <input type="text" id="admin-chat-input" placeholder="Type your reply...">
            <button id="admin-send-button">Send</button>
        </div>
    </div>

    <!-- Firebase Init and Auth Logic -->
    <script src="firebase-init.js"></script> 
    <script src="auth.js"></script> 
    <script src="chat-admin.js"></script> <!-- Link to the admin chat JS -->

</body>
</html>
