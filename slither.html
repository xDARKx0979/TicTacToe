<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slither.io</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
            flex-direction: column;
        }
        .game-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .game-frame {
            width: 100%;
            height: 100%;
            border: none;
        }
        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 1000;
        }
        .button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        .button:hover {
            background-color: #45a049;
        }
        .direct-link {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            background-color: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            display: none;
        }
        .direct-link.show {
            display: block;
        }
        .direct-link a {
            color: #4CAF50;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
        }
        .direct-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="controls">
            <button class="button" onclick="toggleFullscreen()">Fullscreen</button>
            <button class="button" onclick="openInNewTab()">Open in New Tab</button>
        </div>
        <iframe 
            src="http://slither.io" 
            class="game-frame" 
            allowfullscreen
            frameborder="0"
            scrolling="no"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            sandbox="allow-same-origin allow-scripts allow-popups allow-forms"
            referrerpolicy="no-referrer"
        ></iframe>
    </div>

    <div class="direct-link">
        <p>Due to security restrictions, the game may not load in the iframe.</p>
        <p>Click below to play:</p>
        <a href="https://slither.io" target="_blank">Play Slither.io</a>
    </div>

    <script>
        function toggleFullscreen() {
            const container = document.querySelector('.game-container');
            if (!document.fullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                } else if (container.msRequestFullscreen) {
                    container.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }

        function openInNewTab() {
            window.open('https://slither.io', '_blank');
        }

        // Check if iframe loaded successfully
        const iframe = document.querySelector('.game-frame');
        iframe.onload = function() {
            try {
                // Try to access iframe content
                const iframeContent = iframe.contentWindow.document;
                // If we can access it, hide the direct link message
                document.querySelector('.direct-link').classList.remove('show');
            } catch (e) {
                // If we can't access iframe content, show the direct link message
                document.querySelector('.direct-link').classList.add('show');
            }
        };
    </script>
</body>
</html>
