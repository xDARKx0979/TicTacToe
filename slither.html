<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <!-- Allow mixed content -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Slither.io</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
        }
        .game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .game-object {
            width: 100%;
            height: 100%;
            border: none;
        }
        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 1000;
        }
        .button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        .button:hover {
            background-color: #45a049;
        }
        .fallback {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            color: white;
            z-index: 100;
            max-width: 80%;
        }
        .fallback h2 {
            color: #4CAF50;
            margin-top: 0;
        }
        .fallback-button {
            display: inline-block;
            margin: 15px 5px;
            padding: 12px 30px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        .fallback-button:hover {
            background-color: #45a049;
        }
        #direct-link {
            display: inline-block;
            margin-top: 20px;
            color: #4CAF50;
            text-decoration: none;
        }
        #direct-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="controls">
            <button class="button" onclick="toggleFullscreen()">Fullscreen</button>
        </div>
        <object 
            type="text/html" 
            data="https://slither.io"
            class="game-object" 
            id="game-object">
            <p>Unable to load the game</p>
        </object>
    </div>

    <div class="fallback" id="fallback">
        <h2>Slither.io</h2>
        <p>We're having trouble loading the game directly due to website restrictions.</p>
        <button class="fallback-button" onclick="openInNewTab('https://slither.io')">Play Slither.io</button>
        <a id="direct-link" href="https://slither.io" target="_blank">Or click here to open the game</a>
    </div>

    <script>
        function toggleFullscreen() {
            const container = document.querySelector('.game-container');
            if (!document.fullscreenElement) {
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                } else if (container.msRequestFullscreen) {
                    container.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }
        
        function openInNewTab(url) {
            window.open(url, '_blank');
        }
        
        // Check if the object loads properly
        window.onload = function() {
            const gameObject = document.getElementById('game-object');
            
            // Set a timeout to check if the game loaded
            setTimeout(function() {
                try {
                    // Try to check if the game is loaded
                    const width = gameObject.offsetWidth;
                    const height = gameObject.offsetHeight;
                    
                    // If dimensions are too small, game probably didn't load properly
                    if (width < 50 || height < 50) {
                        document.getElementById('fallback').style.display = 'block';
                    }
                } catch (e) {
                    document.getElementById('fallback').style.display = 'block';
                }
            }, 5000);
            
            // Add an error handler
            gameObject.onerror = function() {
                document.getElementById('fallback').style.display = 'block';
            };
        };
    </script>
</body>
</html>
