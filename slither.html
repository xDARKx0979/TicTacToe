<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slither.io</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
            color: white;
        }
        .launch-container {
            text-align: center;
            padding: 2rem;
            background-color: rgba(0, 0, 0, 0.6);
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #4CAF50;
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        .play-button {
            display: inline-block;
            padding: 15px 40px;
            font-size: 1.5rem;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            margin: 10px;
        }
        .play-button:hover {
            background-color: #45a049;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.5);
        }
        .features {
            margin-top: 2rem;
            text-align: left;
        }
        .features ul {
            list-style-type: none;
            padding: 0;
        }
        .features li {
            margin: 10px 0;
            padding-left: 25px;
            position: relative;
        }
        .features li:before {
            content: "•";
            color: #4CAF50;
            font-size: 1.5rem;
            position: absolute;
            left: 0;
        }
        .window-options {
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="launch-container">
        <h1>Slither.io</h1>
        <p>Ready to dominate the arena? Choose how you want to play:</p>
        
        <div class="window-options">
            <button onclick="openGame('new')" class="play-button">Play in New Tab</button>
            <button onclick="openGame('same')" class="play-button">Play in This Tab</button>
        </div>

        <div class="features">
            <ul>
                <li>Grow your snake by collecting glowing orbs</li>
                <li>Compete against players worldwide</li>
                <li>Try to become the longest snake</li>
                <li>Use boost to outmaneuver opponents</li>
                <li>Simple controls, endless fun!</li>
            </ul>
        </div>
    </div>

    <script>
        function openGame(windowType) {
            if (windowType === 'new') {
                window.open('http://slither.io', '_blank');
            } else {
                window.location.href = 'http://slither.io';
            }
        }
    </script>
</body>
</html>
