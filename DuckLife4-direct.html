<!DOCTYPE html>
<html lang="en-us" style="height:100%">
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/x-icon" href="DuckLife4-main/splash.jpg" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Duck Life 4</title>
  <script src="DuckLife4-main/Build/UnityLoader.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #121212;
      color: white;
    }
    #gameContainer {
      width: 960px;
      height: 600px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      padding: 10px;
      background: #333;
    }
    .back-btn {
      display: inline-block;
      background: #444;
      color: white;
      padding: 5px 15px;
      text-decoration: none;
      border-radius: 5px;
      margin: 10px;
    }
    .debug-panel {
      background: rgba(0,0,0,0.7);
      border: 1px solid #333;
      position: fixed;
      bottom: 10px;
      right: 10px;
      width: 300px;
      padding: 10px;
      font-family: monospace;
      font-size: 12px;
      max-height: 200px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Duck Life 4</h1>
    <a href="index.html" class="back-btn">Back to Games</a>
  </div>
  
  <div id="gameContainer"></div>
  
  <div class="debug-panel" id="debugPanel">
    <h3>Debug Info:</h3>
    <div id="debugInfo"></div>
  </div>

  <script>
    var debugInfo = document.getElementById('debugInfo');
    
    function log(msg) {
      console.log(msg);
      if (debugInfo) {
        var now = new Date();
        var time = now.getHours() + ':' + now.getMinutes() + ':' + now.getSeconds();
        debugInfo.innerHTML += '[' + time + '] ' + msg + '<br>';
      }
    }
    
    log('Page loaded, initializing game...');
    
    try {
      if (typeof UnityLoader === 'undefined') {
        log('ERROR: UnityLoader is not defined! Check file paths.');
      } else {
        log('UnityLoader is available, creating game instance...');
        
        var gameInstance = UnityLoader.instantiate("gameContainer", "DuckLife4-main/Build/duck.json", {
          onProgress: function (instance, progress) {
            log('Loading progress: ' + Math.round(progress * 100) + '%');
          }
        });
        
        log('Game instance created: ' + (gameInstance ? 'Success' : 'Failed'));
      }
    } catch (e) {
      log('ERROR initializing game: ' + e.message);
    }
    
    window.addEventListener('error', function(e) {
      log('ERROR event: ' + e.message + ' at ' + e.filename + ':' + e.lineno);
    });
  </script>
</body>
</html>
