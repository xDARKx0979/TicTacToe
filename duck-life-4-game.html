<!DOCTYPE html>
<html lang="en-us" style="height:100%">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Duck Life 4</title>
    <!-- Google AdSense Code -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8366001403141760"
     crossorigin="anonymous"></script>
    <script src="DuckLife4-main/Build/UnityLoader.js"></script>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #121212;
        }
        #gameContainer {
            width: 100%;
            height: 100%;
        }
        #loadingBox {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #debugInfo {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: white;
            font-family: monospace;
            font-size: 12px;
            background: rgba(0,0,0,0.7);
            padding: 5px;
            max-width: 80%;
            max-height: 100px;
            overflow: auto;
            display: none;
        }
        #fallbackLink {
            display: none;
            margin-top: 20px;
        }
        #fallbackLink a {
            color: #3498db;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div id="gameContainer"></div>
    <div id="loadingBox">
        <div class="spinner"></div>
        <div>Loading Duck Life 4...</div>
        <div id="fallbackLink">
            <p>If the game doesn't load, try <a href="DuckLife4-main/index.html" target="_blank">opening directly</a></p>
        </div>
    </div>
    <div id="debugInfo"></div>

    <script>
        var loadingBox = document.getElementById('loadingBox');
        var debugInfo = document.getElementById('debugInfo');
        var fallbackLink = document.getElementById('fallbackLink');
        
        // Show debug info for development
        function log(message) {
            console.log(message);
            if (debugInfo) {
                debugInfo.style.display = 'block';
                debugInfo.innerHTML += message + '<br>';
            }
        }
        
        // Show fallback link after 10 seconds
        setTimeout(function() {
            if (fallbackLink) {
                fallbackLink.style.display = 'block';
            }
        }, 10000);
        
        try {
            log('Initializing Unity loader...');
            
            // Log UnityLoader availability
            if (typeof UnityLoader === 'undefined') {
                log('ERROR: UnityLoader is undefined!');
            } else {
                log('UnityLoader found, instantiating game...');
            }
            
            var gameInstance = UnityLoader.instantiate("gameContainer", "DuckLife4-main/Build/duck.json", {
                onProgress: function (gameInstance, progress) {
                    log('Loading progress: ' + Math.round(progress * 100) + '%');
                    if (progress === 1) {
                        log('Game fully loaded!');
                        loadingBox.style.display = 'none';
                    }
                }
            });
            
            log('Game instance created: ' + (gameInstance ? 'Yes' : 'No'));
        } catch (e) {
            log('ERROR: ' + e.message);
            loadingBox.innerHTML = '<div>Error loading game: ' + e.message + '</div>';
            fallbackLink.style.display = 'block';
        }

        // Add error handling
        window.addEventListener('error', function(e) {
            log('ERROR event: ' + e.message);
            if (loadingBox) {
                loadingBox.innerHTML = '<div>Error loading game. Please refresh the page.</div>';
                fallbackLink.style.display = 'block';
            }
        });
    </script>
</body>
</html>
