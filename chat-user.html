<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with Developer</title>
    <link rel="stylesheet" href="styles.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>

    <!-- Removed inline style block -->
</head>
<body>
    <a href="index.html" class="back-button" style="position: fixed; top: 15px; left: 15px; z-index: 1001;">← Back to Games</a>
    
    <div class="chat-container">
        <div id="chat-messages">
            <div class="loading">Loading chat...</div>
            <!-- Messages will be loaded here -->
        </div>
        <div id="chat-input-area">
            <input type="text" id="chat-input" placeholder="Type your message...">
            <button id="send-button" class="primary-action">Send</button>
        </div>
    </div>

    <!-- Firebase Init and Auth Logic -->
    <script src="firebase-init.js"></script> 
    <script src="auth.js"></script> 
    <script src="chat-user.js"></script> <!-- Link to the user chat JS -->

</body>
</html>
