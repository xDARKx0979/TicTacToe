<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fire Boy and Water Girl</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: #111;
            display: flex;
            flex-direction: column;
        }
        
        .game-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        
        .game-frame {
            width: 100%;
            max-width: 800px;
            height: 85vh;
            border: none;
        }
        
        .back-link {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 999;
        }
        
        .back-button {
            padding: 10px 20px;
            background-color: #f44336;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            text-decoration: none;
            display: inline-block;
        }
        
        .back-button:hover {
            background-color: #d32f2f;
        }
        
        .game-info {
            color: white;
            text-align: center;
            margin-bottom: 20px;
            max-width: 800px;
        }
    </style>
    <script src="theme.js"></script>
</head>
<body>
    <div class="back-link">
        <a href="index.html" class="back-button">Back to Menu</a>
    </div>
    
    <div class="game-container">
        <div class="game-info">
            <h1>Fire Boy and Water Girl</h1>
            <p>Control both Fire Boy and Water Girl simultaneously to solve puzzles and reach the exit doors. Fire Boy can only walk through fire and Water Girl can only walk through water!</p>
        </div>
        
        <iframe class="game-frame" src="https://www.coolmathgames.com/sites/default/files/public_games/40563/" allowfullscreen></iframe>
    </div>
</body>
</html>
