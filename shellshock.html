<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <title>Shell Shockers</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121212;
        }
        .game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 1000;
        }
        .button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        .button:hover {
            background-color: #45a049;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="controls">
        <button class="button" onclick="toggleFullscreen()">Fullscreen</button>
        <button class="button" onclick="switchGameSource(0)">Server 1</button>
        <button class="button" onclick="switchGameSource(1)">Server 2</button>
        <button class="button" onclick="switchGameSource(2)">Server 3</button>
    </div>
    
    <!-- Using alternative hosted versions of Shell Shockers -->
    <iframe id="game-frame-0" src="https://mathematics.gg/shell-shockers" class="game-container" allowfullscreen allow="autoplay; fullscreen; microphone; gamepad; accelerometer; gyroscope; camera"></iframe>
    
    <iframe id="game-frame-1" src="https://ubg98.github.io/shellshockers/" class="game-container hidden" allowfullscreen allow="autoplay; fullscreen; microphone; gamepad; accelerometer; gyroscope; camera"></iframe>
    
    <iframe id="game-frame-2" src="https://html5.gamemonetize.co/pvnfcftxh2k4o1vmjojx5do3c69bv50v/" class="game-container hidden" allowfullscreen allow="autoplay; fullscreen; microphone; gamepad; accelerometer; gyroscope; camera"></iframe>

    <script>
        // Current active frame
        let activeFrame = 0;
        
        // Function to switch between game sources
        function switchGameSource(frameIndex) {
            // Hide all frames
            document.querySelectorAll('.game-container').forEach(frame => {
                frame.classList.add('hidden');
            });
            
            // Show the selected frame
            document.getElementById(`game-frame-${frameIndex}`).classList.remove('hidden');
            activeFrame = frameIndex;
            
            // Try to focus the frame
            document.getElementById(`game-frame-${frameIndex}`).focus();
        }
        
        function toggleFullscreen() {
            const elem = document.documentElement;
            
            if (!document.fullscreenElement) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) { /* Safari */
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) { /* IE11 */
                    elem.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }
        
        // On page load
        window.onload = function() {
            // Initialize with the first frame
            switchGameSource(0);
            
            // Remove sandbox attribute which may be causing issues
            document.querySelectorAll('.game-container').forEach(frame => {
                // Add custom attributes to help bypass restrictions
                frame.setAttribute('loading', 'eager');
                frame.setAttribute('importance', 'high');
            });
        };
    </script>
</body>
</html>
