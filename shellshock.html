<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <title>Shell Shockers</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121212;
        }
        .game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .controls {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 1000;
        }
        .button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        .button:hover {
            background-color: #45a049;
        }
        .hidden {
            display: none;
        }
        .proxy-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            z-index: 2000;
            display: none;
            text-align: center;
            max-width: 500px;
            color: white;
        }
        .proxy-btn {
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .proxy-close {
            position: absolute;
            top: 10px;
            right: 10px;
            cursor: pointer;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="controls">
        <button class="button" onclick="toggleFullscreen()">Fullscreen</button>
        <button class="button" onclick="switchGameSource(0)">Server 1</button>
        <button class="button" onclick="switchGameSource(1)">Server 2</button>
        <button class="button" onclick="switchGameSource(2)">Server 3</button>
        <button class="button" onclick="switchGameSource(3)">Server 4</button>
        <button class="button" onclick="switchGameSource(4)">Server 5</button>
        <button class="button" onclick="showProxyOptions()">Proxy Options</button>
    </div>
    
    <!-- Using alternative hosted versions of Shell Shockers -->
    <iframe id="game-frame-0" src="https://staging.shelley.wbst.app/shell-shockers/" class="game-container" allowfullscreen allow="autoplay; fullscreen; microphone; gamepad; accelerometer; gyroscope; camera"></iframe>
    
    <iframe id="game-frame-1" src="https://script.google.com/macros/s/AKfycbxC3f5dRfbCjUiN-xnA3-A5Vw2x65zg-YkS5ORnqpWTKRyMjDI/exec" class="game-container hidden" allowfullscreen allow="autoplay; fullscreen; microphone; gamepad; accelerometer; gyroscope; camera"></iframe>
    
    <iframe id="game-frame-2" src="https://learningpotential.gq/games/shellshockers/play" class="game-container hidden" allowfullscreen allow="autoplay; fullscreen; microphone; gamepad; accelerometer; gyroscope; camera"></iframe>

    <iframe id="game-frame-3" src="https://outred.github.io/shellshockers/" class="game-container hidden" allowfullscreen allow="autoplay; fullscreen; microphone; gamepad; accelerometer; gyroscope; camera"></iframe>

    <iframe id="game-frame-4" src="https://xlegends.github.io/shellshockers/shellshock.html" class="game-container hidden" allowfullscreen allow="autoplay; fullscreen; microphone; gamepad; accelerometer; gyroscope; camera"></iframe>

    <!-- Proxy Options Dialog -->
    <div id="proxy-dialog" class="proxy-container">
        <span class="proxy-close" onclick="hideProxyOptions()">✕</span>
        <h3>Web Proxy Options</h3>
        <p>Select a proxy to connect to Shell Shockers:</p>
        <button class="proxy-btn" onclick="useSchoolBypass()">School Bypass Method</button>
        <button class="proxy-btn" onclick="useGoogleAPPsMethod()">Google Apps Method</button>
        <button class="proxy-btn" onclick="useCustom()">Enter Custom Proxy URL</button>
        <div id="custom-input" style="margin-top: 15px; display: none;">
            <input type="text" id="custom-proxy-url" placeholder="Enter custom proxy URL" style="padding: 8px; width: 80%;">
            <button class="proxy-btn" style="margin-top: 5px;" onclick="applyCustomProxy()">Apply</button>
        </div>
    </div>

    <script>
        // Current active frame
        let activeFrame = 0;
        
        // Function to switch between game sources
        function switchGameSource(frameIndex) {
            // Hide all frames
            document.querySelectorAll('.game-container').forEach(frame => {
                frame.classList.add('hidden');
            });
            
            // Show the selected frame
            document.getElementById(`game-frame-${frameIndex}`).classList.remove('hidden');
            activeFrame = frameIndex;
            
            // Try to focus the frame
            document.getElementById(`game-frame-${frameIndex}`).focus();
        }
        
        function toggleFullscreen() {
            const elem = document.documentElement;
            
            if (!document.fullscreenElement) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) { /* Safari */
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) { /* IE11 */
                    elem.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }
        
        function showProxyOptions() {
            document.getElementById('proxy-dialog').style.display = 'block';
        }
        
        function hideProxyOptions() {
            document.getElementById('proxy-dialog').style.display = 'none';
            document.getElementById('custom-input').style.display = 'none';
        }
        
        function useSchoolBypass() {
            // Create a new iframe for School Bypass
            const newFrame = document.createElement('iframe');
            newFrame.id = 'game-frame-school-bypass';
            newFrame.className = 'game-container';
            newFrame.allow = 'autoplay; fullscreen; microphone; gamepad; accelerometer; gyroscope; camera';
            newFrame.allowFullscreen = true;
            newFrame.src = 'https://educationbluesky.com/play/shellshock/';
            
            // Add it to the page
            document.body.appendChild(newFrame);
            
            // Switch to the new frame
            document.querySelectorAll('.game-container').forEach(frame => {
                frame.classList.add('hidden');
            });
            newFrame.classList.remove('hidden');
            
            // Hide the dialog
            hideProxyOptions();
        }
        
        function useGoogleAPPsMethod() {
            // Create a new iframe for Google Apps
            const newFrame = document.createElement('iframe');
            newFrame.id = 'game-frame-google';
            newFrame.className = 'game-container';
            newFrame.allow = 'autoplay; fullscreen; microphone; gamepad; accelerometer; gyroscope; camera';
            newFrame.allowFullscreen = true;
            newFrame.src = 'https://docs.google.com/document/d/1ijSQj4rZkv7DxQTCXxwTS3l5P8Ff6ZwG6wgI80L6Nj4/preview';
            
            // Add it to the page
            document.body.appendChild(newFrame);
            
            // Switch to the new frame
            document.querySelectorAll('.game-container').forEach(frame => {
                frame.classList.add('hidden');
            });
            newFrame.classList.remove('hidden');
            
            // Hide the dialog
            hideProxyOptions();
        }
        
        function useCustom() {
            document.getElementById('custom-input').style.display = 'block';
        }
        
        function applyCustomProxy() {
            const customUrl = document.getElementById('custom-proxy-url').value.trim();
            if (customUrl) {
                // Create a new iframe for the custom proxy
                const newFrame = document.createElement('iframe');
                newFrame.id = 'game-frame-custom';
                newFrame.className = 'game-container';
                newFrame.allow = 'autoplay; fullscreen; microphone; gamepad; accelerometer; gyroscope; camera';
                newFrame.allowFullscreen = true;
                newFrame.src = customUrl;
                
                // Add it to the page
                document.body.appendChild(newFrame);
                
                // Switch to the new frame
                document.querySelectorAll('.game-container').forEach(frame => {
                    frame.classList.add('hidden');
                });
                newFrame.classList.remove('hidden');
                
                // Hide the dialog
                hideProxyOptions();
            }
        }
        
        // On page load
        window.onload = function() {
            // Initialize with the first frame
            switchGameSource(0);
            
            // Add performance attributes to help loading
            document.querySelectorAll('.game-container').forEach(frame => {
                // Add custom attributes to help bypass restrictions
                frame.setAttribute('loading', 'eager');
                frame.setAttribute('importance', 'high');
            });
        };
    </script>
</body>
</html>
