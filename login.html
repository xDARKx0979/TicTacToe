<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="styles.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore-compat.js"></script>
    
    <style>
        .auth-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 30px;
            background: var(--card-bg);
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .auth-container h1 {
            margin-bottom: 20px;
            color: var(--text-color);
        }
        .auth-form input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            background: var(--input-bg);
            color: var(--text-color);
            box-sizing: border-box;
        }
        .auth-form button {
            width: 100%;
            padding: 12px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.2s;
        }
        .auth-form button:hover {
            background: var(--primary-hover-color);
        }
        .auth-container p {
            margin-top: 20px;
            color: var(--text-light);
        }
        .auth-container a {
            color: var(--primary-color);
            text-decoration: none;
        }
        .auth-container a:hover {
            text-decoration: underline;
        }
        .error-message {
            color: #dc3545;
            margin-bottom: 15px;
            font-size: 0.9em;
            display: none; /* Hidden by default */
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <h1>Login</h1>
        <form id="login-form" class="auth-form">
            <div id="login-error" class="error-message"></div>
            <!-- Message for email verification status -->
            <div id="auth-message" class="error-message" style="display: none; color: orange; margin-bottom: 10px;"></div>
            <input type="email" id="login-email" placeholder="Email" required>
            <input type="password" id="login-password" placeholder="Password" required>
            <button type="submit">Log In</button>
            <!-- Button to resend verification email -->
             <button type="button" id="resend-verification-button" style="display: none; margin-top: 10px; width: 100%; padding: 10px; background-color: var(--secondary-color); color: var(--text-color); border: 1px solid var(--border-color); border-radius: 5px; cursor: pointer;">Resend Verification Email</button>
        </form>
        <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
    </div>
    
    <!-- Firebase Init and Auth Logic -->
    <script src="firebase-init.js"></script> 
    <script src="auth.js"></script>
    <script src="theme.js"></script>
</body>
</html>
